x2="15.01" y2="9"/></svg></button><button class="snd" id="snd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button><input type="file" id="chatImageInput" multiple accept="image/*,image/gif" style="display:none"><input type="file" id="stickerFileInput" multiple accept="image/*,image/gif" style="display:none">
        <div class="sticker-panel" id="stickerPanel"><div class="sticker-grid" id="stickerGrid"></div><button class="add-sticker-btn" id="addStickerBtn">+ 上传表情包</button></div>
        <div class="ext-panel" id="extPanel">
            <div class="ext-grid">
                <button class="ext-item" id="extCallBtn">
                    <div class="ext-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
                    <span>通话</span>
                </button>
                <button class="ext-item" id="extImgBtn">
                    <div class="ext-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>

                </button>
                <button class="ext-item" id="extQaBtn">
                    <div class="ext-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
                    <span>二选一问答</span>
                </button>
            </div>
        </div>
    </div>
    <div class="custom-modal-overlay" id="customModalOverlay" style="display:none">
        <div class="custom-modal">
            <div class="custom-modal-title" id="customModalTitle">提示</div>
            <div class="custom-modal-body" id="customModalBody"></div>
            <div class="custom-modal-input-container" id="customModalInputContainer" style="display:none">
                <input type="text" class="custom-modal-input" id="customModalInput" autocomplete="off">
            </div>
            <div class="custom-modal-actions" id="customModalActions">
                <button class="btn" id="customModalCancel">取消</button>
                <button class="btn" id="customModalConfirm" style="background:#887B6E;color:#F7F2EC">确定</button>
            </div>
        </div>
    </div>
    <div class="qa-modal-overlay" id="qaModal" style="display:none">
        <div class="qa-modal">
            <div class="qa-modal-title">二选一问答</div>
            <div class="qa-field">
                <label>问题描述</label>
                <input type="text" id="qaQuestion" placeholder="写下你的问题...">
            </div>
            <div class="qa-field">
                <label>选项 A</label>
                <input type="text" id="qaOptA" placeholder="例如：吃火锅">
            </div>
            <div class="qa-field">
                <label>选项 B</label>
                <input type="text" id="qaOptB" placeholder="例如：吃烧烤">
            </div>
            <div class="qa-modal-actions">
                <button class="btn" id="qaCancelBtn">取消</button>
                <button class="btn" id="qaSubmitBtn" style="background:#887B6E;color:#F7F2EC">发送问答</button>
            </div>
        </div>
    </div>

        <div class="call-body" id="callBody">

            <div class="incoming-actions" id="incActions" style="display:none"><button class="incoming-hangup" id="incHangup"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><button class="incoming-accept" id="incAccept"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button></div>
        </div>
        <div class="call-minimized-bar" id="cmiBar"><span id="cmiTime">00:00:00</span><button class="call-restore" id="callRestore"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
    </div>
</div>
